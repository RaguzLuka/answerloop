<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f9fc">
  <title>You're offline · RingLoop</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      background: #f7f9fc; color: #0c1b38;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    main { max-width: 360px; }
    img { width: 140px; height: 140px; }
    h1 { font-size: 1.5rem; letter-spacing: -0.02em; margin: 12px 0 8px; }
    p { color: #4a5878; line-height: 1.55; margin: 0 0 24px; }
    button {
      font: inherit; font-weight: 600; color: #fff; border: 0; border-radius: 999px;
      padding: 12px 22px; background: linear-gradient(180deg, #2e63f0, #1d4fd8); cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <img src="/halo/night.png" alt="">
    <h1>You're offline</h1>
    <p>There's no connection right now. Nothing is lost. Reconnect and your bookings will be right here.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
